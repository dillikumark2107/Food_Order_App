<!DOCTYPE html>
<html>

<head>

    <title>Delete Food</title>

</head>

<body>

    <h1>Delete Food</h1>


    <p>
        Are you sure you want to delete
        <b>{{ food.name }}</b>?
    </p>


    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

    </form>


    <br>

    <a href="{% url 'home' %}">
        Cancel
    </a>


</body>

</html>
