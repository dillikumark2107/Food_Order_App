<!DOCTYPE html>
<html>

<head>

    <title>{% block title %}Food App{% endblock %}</title>

    {% load static %}

    <link rel="stylesheet"
          href="{% static 'style.css' %}">

</head>

<body>

    <nav>

        <div class="logo">
            🍴 Food App
        </div>

        {% if user.is_authenticated %}

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'my_orders' %}">
                My Orders
            </a>

            <a href="{% url 'logout' %}">
                Logout
            </a>

        {% else %}

            <a href="{% url 'login' %}">
                Login
            </a>

            <a href="{% url 'register' %}">
                Register
            </a>

        {% endif %}

    </nav>


    <main>

        {% block content %}

        {% endblock %}

    </main>

</body>

</html>
