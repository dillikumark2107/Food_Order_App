{% extends 'base.html' %}

{% block title %}
Register
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>📝 Create Account</h1>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}


        <button type="submit">
            Register
        </button>

    </form>


    <p class="bottom-text">

        Already have an account?

        <a href="{% url 'login' %}">
            Login
        </a>

    </p>

</div>

{% endblock %}
